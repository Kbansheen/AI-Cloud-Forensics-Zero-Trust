<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZT Trust Engine — Continuous Trust Re-Evaluation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-base:    #070c18;
      --bg-surface: #0d1526;
      --bg-card:    #111e35;
      --bg-hover:   #162340;
      --border:     #1e2d47;
      --border-hi:  #2a3f5f;
      --text-pri:   #e8eef8;
      --text-sec:   #7a91b0;
      --text-dim:   #3d5270;
      --z-green:  #10b981;
      --z-yellow: #f59e0b;
      --z-orange: #f97316;
      --z-red:    #ef4444;
      --z-purple: #7c3aed;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }
    html, body, #root { height: 100%; background: var(--bg-base); color: var(--text-pri); font-family: var(--font-sans); }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
    @keyframes pulse-ring { 0%{opacity:.8;transform:scale(1)} 100%{opacity:0;transform:scale(1.06)} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
